<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Expenses — FinTrack</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="sidebar" id="sidebar">
    <div class="sidebar-brand">
        <i class="fa-solid fa-wallet brand-icon"></i>
        <span>FinTrack</span>
    </div>
    <nav class="sidebar-nav">
        <a href="/dashboard" class="nav-item"><i class="fa-solid fa-gauge-high"></i><span>Dashboard</span></a>
        <a href="/expenses" class="nav-item active"><i class="fa-solid fa-receipt"></i><span>Expenses</span></a>
        <a href="/income" class="nav-item"><i class="fa-solid fa-money-bill-trend-up"></i><span>Income</span></a>
    </nav>
    <div class="sidebar-footer">
        <a href="/logout" class="nav-item logout-item"><i class="fa-solid fa-right-from-bracket"></i><span>Logout</span></a>
    </div>
</div>

<div class="main-content">
    <header class="topbar">
        <div class="topbar-left">
            <button class="sidebar-toggle d-lg-none" onclick="toggleSidebar()"><i class="fa-solid fa-bars"></i></button>
            <div>
                <h1 class="page-title">Expense Manager</h1>
                <p class="page-subtitle">Track and manage your spending</p>
            </div>
        </div>
    </header>

    <!-- ADD EXPENSE FORM -->
    <div class="form-card mt-3">
        <h5 class="form-card-title"><i class="fa-solid fa-plus-circle me-2 text-info"></i>Add New Expense</h5>
        <form action="/expenses/save" method="post">
            <div class="row g-3">
                <div class="col-md-3">
                    <input type="text" name="title" placeholder="Expense title" class="form-control ft-input" required>
                </div>
                <div class="col-md-3">
                    <select name="category" class="form-control ft-input ft-select" required>
                        <option value="" disabled selected>Select Category</option>
                        <option>Food &amp; Dining</option>
                        <option>Transport</option>
                        <option>Shopping</option>
                        <option>Entertainment</option>
                        <option>Healthcare</option>
                        <option>Education</option>
                        <option>Utilities</option>
                        <option>Rent</option>
                        <option>Other</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <input type="number" name="amount" placeholder="Amount (₹)" class="form-control ft-input" min="0" step="0.01" required>
                </div>
                <div class="col-md-2">
                    <input type="date" name="date" class="form-control ft-input">
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn btn-add w-100 h-100">
                        <i class="fa-solid fa-plus me-1"></i>Add
                    </button>
                </div>
            </div>
        </form>
    </div>

    <!-- SEARCH -->
    <div class="form-card mt-3">
        <form action="/expenses/search" method="get">
            <div class="row g-2">
                <div class="col-md-10">
                    <input type="text" name="keyword" class="form-control ft-input" placeholder="Search expenses by title...">
                </div>
                <div class="col-md-2">
                    <button class="btn btn-search w-100"><i class="fa-solid fa-magnifying-glass me-1"></i>Search</button>
                </div>
            </div>
        </form>
    </div>

    <!-- TABLE -->
    <div class="table-card mt-3">
        <div class="table-card-header">
            <h4><i class="fa-solid fa-list me-2"></i>All Expenses</h4>
            <a href="/expenses" class="btn btn-outline-secondary btn-sm">
                <i class="fa-solid fa-rotate-left me-1"></i>Clear Search
            </a>
        </div>
        <div class="table-responsive">
            <table class="table custom-table">
                <thead>
                <tr>
                    <th>Title</th>
                    <th>Category</th>
                    <th>Amount</th>
                    <th>Date</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="expense : ${expenses}">
                    <td>
                        <div class="d-flex align-items-center gap-2">
                            <div class="tx-icon"><i class="fa-solid fa-receipt"></i></div>
                            <span th:text="${expense.title}"></span>
                        </div>
                    </td>
                    <td><span class="category-badge" th:text="${expense.category}"></span></td>
                    <td class="amount-col">₹<span th:text="${#numbers.formatDecimal(expense.amount, 1, 2)}"></span></td>
                    <td th:text="${expense.date}"></td>
                    <td>
                        <div class="d-flex gap-2">
                            <a th:href="@{/expenses/edit/{id}(id=${expense.id})}" class="btn btn-edit btn-sm">
                                <i class="fa-solid fa-pen"></i>
                            </a>
                            <a th:href="@{/expenses/delete/{id}(id=${expense.id})}"
                               class="btn btn-delete btn-sm"
                               onclick="return confirm('Delete this expense?')">
                                <i class="fa-solid fa-trash"></i>
                            </a>
                        </div>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(expenses)}">
                    <td colspan="5" class="text-center py-4 text-muted">
                        <i class="fa-solid fa-inbox fa-2x mb-2 d-block"></i>No expenses found.
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
function toggleSidebar() { document.getElementById('sidebar').classList.toggle('sidebar-open'); }
</script>
</body>
</html>
