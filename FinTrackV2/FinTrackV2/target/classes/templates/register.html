<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register — FinTrack</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="auth-body">
<div class="auth-bg-orbs">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
</div>
<div class="auth-container">
    <div class="auth-card">
        <div class="text-center mb-4">
            <div class="auth-logo-wrap">
                <i class="fa-solid fa-wallet"></i>
            </div>
            <h1 class="auth-title mt-3">Create Account</h1>
            <p class="auth-subtitle">Join FinTrack and take control of your finances</p>
        </div>

        <div th:if="${error}" class="alert alert-danger">
            <i class="fa-solid fa-triangle-exclamation me-2"></i>
            <span th:text="${error}"></span>
        </div>

        <form th:action="@{/register}" method="post" th:object="${user}">
            <div class="mb-3">
                <label class="form-label auth-label"><i class="fa-solid fa-user me-2"></i>Username</label>
                <input type="text" name="username" placeholder="Your display name"
                       class="form-control auth-input" required autofocus>
            </div>
            <div class="mb-3">
                <label class="form-label auth-label"><i class="fa-solid fa-envelope me-2"></i>Email Address</label>
                <input type="email" name="email" placeholder="you@example.com"
                       class="form-control auth-input" required>
            </div>
            <div class="mb-4">
                <label class="form-label auth-label"><i class="fa-solid fa-lock me-2"></i>Password</label>
                <div class="input-group">
                    <input type="password" id="regPassword" name="password" placeholder="Min. 8 characters"
                           class="form-control auth-input" required minlength="8">
                    <button class="btn auth-eye-btn" type="button" onclick="togglePwd('regPassword', this)">
                        <i class="fa-solid fa-eye"></i>
                    </button>
                </div>
            </div>
            <button type="submit" class="btn auth-btn w-100">
                <i class="fa-solid fa-paper-plane me-2"></i>Create Account &amp; Get OTP
            </button>
        </form>

        <div class="text-center mt-4">
            <span class="auth-link-text">Already have an account?</span>
            <a href="/login" class="auth-link ms-1">Sign in</a>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
function togglePwd(id, btn) {
    const input = document.getElementById(id);
    const icon = btn.querySelector('i');
    if (input.type === 'password') {
        input.type = 'text';
        icon.className = 'fa-solid fa-eye-slash';
    } else {
        input.type = 'password';
        icon.className = 'fa-solid fa-eye';
    }
}
</script>
</body>
</html>
