<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Income — FinTrack</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="sidebar" id="sidebar">
    <div class="sidebar-brand">
        <i class="fa-solid fa-wallet brand-icon"></i>
        <span>FinTrack</span>
    </div>
    <nav class="sidebar-nav">
        <a href="/dashboard" class="nav-item"><i class="fa-solid fa-gauge-high"></i><span>Dashboard</span></a>
        <a href="/expenses" class="nav-item"><i class="fa-solid fa-receipt"></i><span>Expenses</span></a>
        <a href="/income" class="nav-item active"><i class="fa-solid fa-money-bill-trend-up"></i><span>Income</span></a>
    </nav>
    <div class="sidebar-footer">
        <a href="/logout" class="nav-item logout-item"><i class="fa-solid fa-right-from-bracket"></i><span>Logout</span></a>
    </div>
</div>

<div class="main-content">
    <header class="topbar">
        <div class="topbar-left">
            <button class="sidebar-toggle d-lg-none" onclick="toggleSidebar()"><i class="fa-solid fa-bars"></i></button>
            <div>
                <h1 class="page-title">Income Manager</h1>
                <p class="page-subtitle">Track all your income sources</p>
            </div>
        </div>
    </header>

    <!-- ADD INCOME FORM -->
    <div class="form-card mt-3">
        <h5 class="form-card-title"><i class="fa-solid fa-plus-circle me-2 text-success"></i>Add Income Source</h5>
        <form action="/income/save" method="post">
            <div class="row g-3">
                <div class="col-md-5">
                    <input type="text" name="source" placeholder="Income source (e.g. Salary, Freelance)" class="form-control ft-input" required>
                </div>
                <div class="col-md-4">
                    <input type="number" name="amount" placeholder="Amount (₹)" class="form-control ft-input" min="0" step="0.01" required>
                </div>
                <div class="col-md-3">
                    <button type="submit" class="btn btn-add-income w-100">
                        <i class="fa-solid fa-plus me-1"></i>Add Income
                    </button>
                </div>
            </div>
        </form>
    </div>

    <!-- TABLE -->
    <div class="table-card mt-3">
        <div class="table-card-header">
            <h4><i class="fa-solid fa-list me-2"></i>Income Sources</h4>
        </div>
        <div class="table-responsive">
            <table class="table custom-table">
                <thead>
                <tr>
                    <th>Source</th>
                    <th>Amount</th>
                    <th>Action</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="income : ${incomes}">
                    <td>
                        <div class="d-flex align-items-center gap-2">
                            <div class="tx-icon income-icon"><i class="fa-solid fa-money-bill"></i></div>
                            <span th:text="${income.source}"></span>
                        </div>
                    </td>
                    <td class="amount-col income-amount">₹<span th:text="${#numbers.formatDecimal(income.amount, 1, 2)}"></span></td>
                    <td>
                        <div class="d-flex gap-2">
                            <a th:href="@{/income/edit/{id}(id=${income.id})}" class="btn btn-edit btn-sm">
                                <i class="fa-solid fa-pen"></i>
                            </a>
                            <a th:href="@{/income/delete/{id}(id=${income.id})}"
                               class="btn btn-delete btn-sm"
                               onclick="return confirm('Delete this income entry?')">
                                <i class="fa-solid fa-trash"></i>
                            </a>
                        </div>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(incomes)}">
                    <td colspan="3" class="text-center py-4 text-muted">
                        <i class="fa-solid fa-inbox fa-2x mb-2 d-block"></i>No income added yet.
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
function toggleSidebar() { document.getElementById('sidebar').classList.toggle('sidebar-open'); }
</script>
</body>
</html>
