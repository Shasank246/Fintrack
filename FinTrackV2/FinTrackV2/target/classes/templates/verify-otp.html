<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify OTP — FinTrack</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="auth-body">
<div class="auth-bg-orbs">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
</div>
<div class="auth-container">
    <div class="auth-card">
        <div class="text-center mb-4">
            <div class="auth-logo-wrap otp-logo">
                <i class="fa-solid fa-shield-halved"></i>
            </div>
            <h1 class="auth-title mt-3">Verify Your Email</h1>
            <p class="auth-subtitle">
                We sent a 6-digit OTP to<br>
                <strong th:text="${email}" class="text-info"></strong>
            </p>
        </div>

        <div th:if="${success}" class="alert alert-success">
            <i class="fa-solid fa-circle-check me-2"></i>
            <span th:text="${success}"></span>
        </div>
        <div th:if="${error}" class="alert alert-danger">
            <i class="fa-solid fa-triangle-exclamation me-2"></i>
            <span th:text="${error}"></span>
        </div>

        <form th:action="@{/verify-otp}" method="post">
            <input type="hidden" name="email" th:value="${email}">
            <div class="mb-4">
                <label class="form-label auth-label text-center w-100">Enter OTP</label>
                <div class="otp-inputs d-flex gap-2 justify-content-center">
                    <input type="text" maxlength="1" class="otp-digit form-control auth-input text-center" id="d1">
                    <input type="text" maxlength="1" class="otp-digit form-control auth-input text-center" id="d2">
                    <input type="text" maxlength="1" class="otp-digit form-control auth-input text-center" id="d3">
                    <input type="text" maxlength="1" class="otp-digit form-control auth-input text-center" id="d4">
                    <input type="text" maxlength="1" class="otp-digit form-control auth-input text-center" id="d5">
                    <input type="text" maxlength="1" class="otp-digit form-control auth-input text-center" id="d6">
                </div>
                <input type="hidden" name="otp" id="otpHidden">
            </div>

            <div class="otp-timer text-center mb-3">
                <span id="timerText">OTP expires in <span id="countdown" class="text-info fw-bold">10:00</span></span>
            </div>

            <button type="submit" class="btn auth-btn w-100" id="verifyBtn" onclick="assembleOtp()">
                <i class="fa-solid fa-check-circle me-2"></i>Verify OTP
            </button>
        </form>

        <form th:action="@{/resend-otp}" method="post" class="mt-3">
            <input type="hidden" name="email" th:value="${email}">
            <button type="submit" class="btn auth-btn-outline w-100">
                <i class="fa-solid fa-rotate-right me-2"></i>Resend OTP
            </button>
        </form>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
// Auto-advance OTP boxes
const digits = document.querySelectorAll('.otp-digit');
digits.forEach((d, i) => {
    d.addEventListener('input', () => {
        if (d.value && i < digits.length - 1) digits[i + 1].focus();
    });
    d.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !d.value && i > 0) digits[i - 1].focus();
    });
    d.addEventListener('paste', (e) => {
        const paste = e.clipboardData.getData('text').trim();
        if (paste.length === 6) {
            paste.split('').forEach((ch, idx) => { if (digits[idx]) digits[idx].value = ch; });
            e.preventDefault();
        }
    });
});
digits[0].focus();

function assembleOtp() {
    document.getElementById('otpHidden').value =
        Array.from(digits).map(d => d.value).join('');
}

// Countdown timer
let seconds = 600;
const countdown = document.getElementById('countdown');
const interval = setInterval(() => {
    seconds--;
    const m = Math.floor(seconds / 60);
    const s = seconds % 60;
    countdown.textContent = `${m}:${s.toString().padStart(2,'0')}`;
    if (seconds <= 0) {
        clearInterval(interval);
        countdown.textContent = 'Expired';
        countdown.className = 'text-danger fw-bold';
    }
}, 1000);
</script>
</body>
</html>
