<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Expense — FinTrack</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="sidebar" id="sidebar">
    <div class="sidebar-brand">
        <i class="fa-solid fa-wallet brand-icon"></i>
        <span>FinTrack</span>
    </div>
    <nav class="sidebar-nav">
        <a href="/dashboard" class="nav-item"><i class="fa-solid fa-gauge-high"></i><span>Dashboard</span></a>
        <a href="/expenses" class="nav-item active"><i class="fa-solid fa-receipt"></i><span>Expenses</span></a>
        <a href="/income" class="nav-item"><i class="fa-solid fa-money-bill-trend-up"></i><span>Income</span></a>
    </nav>
    <div class="sidebar-footer">
        <a href="/logout" class="nav-item logout-item"><i class="fa-solid fa-right-from-bracket"></i><span>Logout</span></a>
    </div>
</div>

<div class="main-content">
    <header class="topbar">
        <div class="topbar-left">
            <div>
                <h1 class="page-title">Edit Expense</h1>
                <p class="page-subtitle">Update expense details</p>
            </div>
        </div>
    </header>

    <div class="form-card mt-3" style="max-width:600px;">
        <h5 class="form-card-title"><i class="fa-solid fa-pen-to-square me-2 text-warning"></i>Edit Expense</h5>
        <form th:action="@{/expenses/update}" method="post" th:object="${expense}">
            <input type="hidden" th:field="*{id}">
            <div class="mb-3">
                <label class="form-label auth-label">Title</label>
                <input type="text" th:field="*{title}" class="form-control ft-input" required>
            </div>
            <div class="mb-3">
                <label class="form-label auth-label">Category</label>
                <select th:field="*{category}" class="form-control ft-input ft-select" required>
                    <option value="" disabled>Select Category</option>
                    <option value="Food &amp; Dining">Food &amp; Dining</option>
                    <option value="Transport">Transport</option>
                    <option value="Shopping">Shopping</option>
                    <option value="Entertainment">Entertainment</option>
                    <option value="Healthcare">Healthcare</option>
                    <option value="Education">Education</option>
                    <option value="Utilities">Utilities</option>
                    <option value="Rent">Rent</option>
                    <option value="Other">Other</option>
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label auth-label">Amount (₹)</label>
                <input type="number" th:field="*{amount}" class="form-control ft-input" min="0" step="0.01" required>
            </div>
            <div class="mb-4">
                <label class="form-label auth-label">Date</label>
                <input type="date" th:field="*{date}" class="form-control ft-input">
            </div>
            <div class="d-flex gap-3">
                <button type="submit" class="btn btn-add">
                    <i class="fa-solid fa-floppy-disk me-2"></i>Save Changes
                </button>
                <a href="/expenses" class="btn btn-outline-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
